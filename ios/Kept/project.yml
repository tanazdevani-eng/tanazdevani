name: Kept
options:
  bundleIdPrefix: com.kept.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1

targets:
  Kept:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kept
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kept.app
        PRODUCT_NAME: Kept
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    entitlements:
      path: Kept/Resources/Kept.entitlements
      properties:
        aps-environment: development
    info:
      path: Kept/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kept
        UILaunchScreen: {}
        UIAppFonts:
          - Fraunces-Regular.ttf
          - Fraunces-Medium.ttf
          - Fraunces-SemiBold.ttf
          - Fraunces-MediumItalic.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        NSPhotoLibraryUsageDescription: Kept uses your photo library so you can set a profile photo.
        NSContactsUsageDescription: Kept can check your contacts to help you find friends already using the app.
        NSUserTrackingUsageDescription: Kept does not track you across other apps or websites. This is required boilerplate only if analytics are added later.
        CFBundleURLTypes:
          - CFBundleURLName: com.kept.app.invite
            CFBundleURLSchemes:
              - kept
    dependencies:
      - package: Supabase
        product: Supabase

schemes:
  Kept:
    build:
      targets:
        Kept: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Kept.storekit
